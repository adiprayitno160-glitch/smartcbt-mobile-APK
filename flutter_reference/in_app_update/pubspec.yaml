name: in_app_update
description: Modul In-App Force Update & Auto-Install APK siap produksi untuk aplikasi Android mandiri (self-hosted / tanpa Google Play Store).
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.1
  package_info_plus: ^8.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
